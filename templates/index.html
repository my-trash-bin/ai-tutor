<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neito AI</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#181a1f;--line:#2b2e36;--text:#f2f2f3;--muted:#969ba8;--accent:#b8f34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}button,select,textarea{font:inherit;color:inherit}.app{display:grid;grid-template-columns:280px 1fr;height:100vh}.side{background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow:auto}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px}.brand i{color:var(--accent);font-style:normal}.new{width:100%;margin:18px 0;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#172000;font-weight:800;cursor:pointer}.session{padding:11px;border-radius:9px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session:hover,.session.active{background:#252831;color:var(--text)}main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}.top{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px}.reset-note{font-size:12px;color:var(--muted)}#messages{overflow:auto;padding:30px max(20px,calc((100% - 820px)/2))}.message{max-width:80%;margin:0 0 24px}.message.user{margin-left:auto;background:#292d35;border-radius:16px 16px 4px 16px;padding:12px 15px}.message.assistant{margin-right:auto}.message pre{overflow:auto;background:#08090b;padding:13px;border-radius:10px}.files{font-size:12px;color:var(--accent);margin-top:6px}.composer{padding:14px max(20px,calc((100% - 860px)/2)) 22px}.box{display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}.box:focus-within{border-color:#616875}textarea{flex:1;resize:none;min-height:44px;max-height:160px;background:transparent;border:0;outline:0;padding:10px}.icon,.send{border:0;border-radius:10px;cursor:pointer;height:40px}.icon{background:#292d35;width:40px}.send{background:var(--accent);color:#172000;font-weight:800;padding:0 17px}.pending{font-size:12px;color:var(--muted);padding:4px 8px}.empty{text-align:center;color:var(--muted);padding-top:20vh}.error{color:#ff8f8f}@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.side{padding:9px 10px;border:0;border-bottom:1px solid var(--line)}.brand{display:inline-block;margin-right:10px}.new{width:auto;margin:0;padding:8px 11px}#sessions{display:flex;overflow:auto;margin-top:7px}.session{min-width:120px;padding:7px 9px}.top{padding:10px;flex-wrap:wrap}.reset-note{width:100%}.message{max-width:92%}}
  </style>
</head>
<body><div class="app"><aside class="side"><div class="brand">NEITO <i>AI</i></div><button class="new" onclick="createSession()">+ 새 채팅</button><div id="sessions"></div></aside><main><header class="top"><select id="model"></select><select id="prompt"></select><span class="reset-note">프롬프트 변경 시 이후 대화는 새 컨텍스트로 시작합니다.</span></header><section id="messages"><div class="empty">무엇이든 물어보세요.</div></section><footer class="composer"><div id="pending" class="pending"></div><form class="box" id="form"><input type="file" id="files" multiple hidden><button type="button" class="icon" title="파일 첨부" onclick="document.getElementById('files').click()">＋</button><textarea id="input" placeholder="메시지를 입력하세요" rows="1"></textarea><button class="send">전송</button></form></footer></main></div>
<script>
let current=null, config=null;
const $=id=>document.getElementById(id), esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const r=await fetch(url,options),body=await r.json();if(!r.ok)throw Error(body.error||'요청에 실패했습니다.');return body}
async function init(){config=await api('/api/config');$('model').innerHTML=config.models.map(x=>`<option>${esc(x)}</option>`).join('');$('prompt').innerHTML=config.prompts.map(x=>`<option value="${x.key}">${x.name}</option>`).join('');await loadSessions();if(!current)await createSession()}
async function loadSessions(select){const list=await api('/api/sessions');$('sessions').innerHTML=list.map(s=>`<div class="session ${s.id===current?'active':''}" onclick="openSession('${s.id}')">${esc(s.title)}</div>`).join('');if(select)await openSession(select);else if(!current&&list[0])await openSession(list[0].id)}
async function createSession(){const data=await api('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('model').value||config.models[0],prompt_key:$('prompt').value||'tutor'})});current=data.id;await loadSessions(current)}
async function openSession(id){current=id;const data=await api('/api/sessions/'+id);$('model').value=data.session.model;$('prompt').value=data.session.prompt_key;render(data.messages);await loadSessions()}
function render(messages){$('messages').innerHTML=messages.length?messages.map(m=>`<article class="message ${m.role}"><div>${esc(m.content).replace(/\n/g,'<br>')}</div>${m.attachments?.length?`<div class="files">📎 ${m.attachments.map(x=>esc(x.name)).join(', ')}</div>`:''}</article>`).join(''):'<div class="empty">무엇이든 물어보세요.</div>';$('messages').scrollTop=$('messages').scrollHeight}
async function updateSettings(){if(!current)return;try{await api('/api/sessions/'+current,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('model').value,prompt_key:$('prompt').value})});await loadSessions()}catch(e){alert(e.message)}}
$('model').onchange=updateSettings;$('prompt').onchange=updateSettings;
$('files').onchange=()=>{$('pending').textContent=[...$('files').files].map(x=>x.name).join(', ')};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
$('form').onsubmit=async e=>{e.preventDefault();const text=$('input').value.trim(), chosen=[...$('files').files];if(!text&&!chosen.length)return;const fd=new FormData();fd.append('content',text);chosen.forEach(f=>fd.append('files',f));$('input').value='';$('files').value='';$('pending').textContent='응답을 기다리는 중…';try{await api(`/api/sessions/${current}/messages`,{method:'POST',body:fd});await openSession(current)}catch(err){$('pending').innerHTML=`<span class="error">${esc(err.message)}</span>`}finally{if(!$('pending').querySelector('.error'))$('pending').textContent=''}};
init().catch(e=>$('messages').innerHTML=`<div class="empty error">${esc(e.message)}</div>`);
</script></body></html>
